<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8" />
  {% assign redirect_url = page.redirect_to | default: '/' | absolute_url %}
  <title>{{ page.title | default: 'Redirecting' | escape }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="{{ redirect_url | escape }}" />
  <meta http-equiv="refresh" content="0; url={{ redirect_url | escape }}" />
  <script>location.replace({{ redirect_url | jsonify }});</script>
</head>
<body>
  <p>This page has moved to <a href="{{ redirect_url | escape }}">{{ redirect_url | escape }}</a>.</p>
</body>
</html>
